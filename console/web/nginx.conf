server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 默认 1m。构建上下文等上传走 /api，1g 覆盖单次实际上传，避免再返回 413。
    client_max_body_size 1g;

    # Shell 是 WebSocket。Upgrade / Connection 是逐跳头，不显式转发时 BFF 收不到 101 握手。
    location ~ ^/api/(admin/)?sandboxes/[^/]+/shell/ws$ {
        proxy_pass http://opensandbox-console-bff.opensandbox-system.svc.cluster.local:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dashboard queries can outlive the default proxy read timeout.
    location /api/grafana/ {
        proxy_pass http://opensandbox-console-bff.opensandbox-system.svc.cluster.local:8091/api/grafana/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://opensandbox-console-bff.opensandbox-system.svc.cluster.local:8091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://opensandbox-console-bff.opensandbox-system.svc.cluster.local:8091/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
